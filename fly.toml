app = "collaborative-document-editor"
primary_region = "iad"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/app.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
